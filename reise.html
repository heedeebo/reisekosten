<!DOCTYPE html>
<!-- reise.html: Übersicht einer Reise. Adresse immer mit ?id=..., z. B. reise.html?id=3
     Später kommen hier noch die Pauschale, die Belege und die Summe dazu. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Trip</title>
    <link rel="stylesheet" href="style.css?v=16">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
  </head>

  <body>
    <header>
      <a id="bearbeiten" href="#" class="kopf-link">Edit</a>
      <a href="index.html" class="zurueck">‹ Trips</a>
      <!-- reise.js schreibt hier das Ziel hinein. -->
      <h1 id="titel">Trip</h1>
      <p id="untertitel" class="untertitel"></p>
    </header>

    <main>
      <!-- Übersicht: was die Reise insgesamt bringt. reise.js trägt die Beträge ein. -->
      <section>
        <ul class="liste">
          <li class="zeile tag-kopf"><span>Meal allowance</span><span id="ue-pauschale"></span></li>
          <li class="zeile tag-kopf"><span>Receipts</span><span id="ue-belege"></span></li>
          <li class="zeile tag-kopf"><span class="titel">Total</span><span id="ue-gesamt" class="titel"></span></li>
        </ul>
      </section>

      <section>
        <!-- Überschrift links, Summe der Pauschale rechts. -->
        <div class="abschnitt-kopf">
          <h2>Meal Allowance</h2>
          <span id="summe-pauschale" class="summe"></span>
        </div>
        <p class="hinweis">Tap a meal if it was provided, for example when you were invited. It is deducted from that day.</p>
        <!-- reise.js füllt diese Liste mit einem Eintrag pro Tag. -->
        <ul id="tage" class="liste"></ul>
      </section>

      <section>
        <div class="abschnitt-kopf">
          <h2>Receipts</h2>
          <!-- reise.js setzt hier ?reise=... ein, damit die Reise schon ausgewählt ist. -->
          <a id="beleg-neu" href="beleg.html" class="kopf-link">+ Add</a>
        </div>
        <ul id="belege" class="liste">
          <li class="leer">No receipts yet.</li>
        </ul>
      </section>
    </main>

    <script src="fehler.js?v=16"></script>
    <script src="db.js?v=16"></script>
    <script src="format.js?v=16"></script>
    <script src="tage.js?v=16"></script>
    <script src="pauschale.js?v=16"></script>
    <script src="kategorien.js?v=16"></script>
    <script src="summen.js?v=16"></script>
    <script src="belegzeile.js?v=16"></script>
    <script src="reise.js?v=16"></script>
  </body>
</html>
