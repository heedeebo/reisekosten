<!DOCTYPE html>
<!-- einstellungen.html: Seite für Name, Wohnort und Standard-Vorschuss. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">

    <!-- App-Daten fürs Installieren: Name, Icon, Farben (siehe manifest.webmanifest). -->
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Das iPhone nimmt für den Homescreen dieses Icon. -->
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!-- Vom Homescreen aus ohne Safari-Leisten öffnen, wie eine echte App. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
  </head>

  <body>
    <header>
      <!-- a ist ein Link. href sagt, wohin er führt. -->
      <a href="index.html" class="zurueck">‹ Back</a>
      <h1>Settings</h1>
    </header>

    <main>
      <!-- form ist ein Formular. Beim Absenden fängt einstellungen.js es ab. -->
      <!-- novalidate: Wir prüfen selbst (z. B. die E-Mail), damit die Meldungen englisch sind. -->
      <form id="formular" class="formular" novalidate>

        <!-- label ist die Beschriftung. for="name" verbindet sie mit dem Feld id="name".
             Dann kann man auch auf die Beschriftung tippen, um ins Feld zu kommen. -->
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="First and last name">

        <label for="wohnort">Home town</label>
        <input id="wohnort" type="text" autocomplete="address-level2" placeholder="e.g. Hamburg">
        <p class="hinweis">Used for "Place, Date" on the report.</p>

        <label for="vorschuss">Default advance (€)</label>
        <!-- inputmode="decimal" zeigt auf dem iPhone die Zahlentastatur mit Komma. -->
        <input id="vorschuss" type="text" inputmode="decimal" placeholder="0,00">

        <!-- Wer die Abrechnung genehmigt und unterschreibt. Steht im PDF beim Unterschriftsfeld. -->
        <label for="chef-name">Supervisor (approves the report)</label>
        <input id="chef-name" type="text" placeholder="First and last name">

        <label for="chef-mail">Supervisor email</label>
        <!-- type="email" zeigt auf dem iPhone die Tastatur mit @ -->
        <input id="chef-mail" type="email" autocomplete="off" placeholder="name@company.com">

        <button type="submit" class="knopf knopf-haupt">Save</button>

        <!-- Hier erscheint "Saved." oder eine Fehlermeldung. -->
        <p id="meldung" class="meldung" role="status"></p>
      </form>

      <!-- Sicherung aller Daten. Die Knöpfe steuert einstellungen.js, die Arbeit macht sicherung.js. -->
      <section class="gruppe">
        <p class="gruppe-titel">Backup</p>
        <p class="hinweis">All trips, receipts and photos are stored only on this iPhone.
          Export a backup now and then and keep it in iCloud Drive or send it to yourself.</p>
        <p id="letzte-sicherung" class="hinweis"></p>
        <button type="button" id="sichern" class="knopf knopf-haupt">Export backup</button>
        <!-- Das echte Datei-Feld ist unsichtbar, das label sieht aus wie ein Knopf. -->
        <label for="sicherung-datei" class="knopf">Import backup</label>
        <input id="sicherung-datei" class="unsichtbar" type="file" accept=".json,application/json">
        <p id="sicherung-status" class="hinweis" role="status"></p>
      </section>

      <!-- Versionsnummer: Bei jedem Update zählen wir hoch. So siehst du auf dem iPhone,
           ob die neue Version schon angekommen ist. -->
      <p class="hinweis version">App version 27 (new design)</p>
    </main>

    <!-- Die Reihenfolge ist wichtig: einstellungen.js braucht db.js, format.js und sicherung.js. -->
    <script src="fehler.js"></script>
    <script src="offline.js"></script>
    <script src="navigation.js"></script>
    <script src="hilfen.js"></script>
    <script src="db.js"></script>
    <script src="format.js"></script>
    <script src="sicherung.js"></script>
    <script src="einstellungen.js"></script>
  </body>
</html>
