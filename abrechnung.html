<!DOCTYPE html>
<!-- abrechnung.html: Abrechnung für einen Zeitraum, mit allen Reisen darin. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Report</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
  </head>

  <body>
    <header>
      <a href="index.html" class="zurueck">‹ Trips</a>
      <h1>Report</h1>
    </header>

    <main>
      <!-- Einstellungen der Abrechnung. Alles wird sofort neu gerechnet. -->
      <form id="formular" class="formular" novalidate>
        <!-- type="month": Das iPhone zeigt eine Auswahl für Monat und Jahr. -->
        <div class="zwei-spalten">
          <div>
            <label for="von">From</label>
            <input id="von" type="month">
          </div>
          <div>
            <label for="bis">To</label>
            <input id="bis" type="month">
          </div>
        </div>

        <label for="vorschuss">Advance received (€)</label>
        <input id="vorschuss" type="text" inputmode="decimal" placeholder="0,00">

        <p class="feld-titel">Extra costs without receipt</p>
        <!-- abrechnung.js baut hier eine Zeile pro Extrakosten (Text + Betrag + Entfernen). -->
        <div id="extra-zeilen"></div>
        <button type="button" id="extra-neu" class="knopf">+ Add extra cost</button>
      </form>

      <!-- Hinweise, z. B. Restaurantbelege ohne Genehmigung. -->
      <div id="hinweise"></div>

      <!-- Deine Unterschrift. Einmal mit dem Finger, die App merkt sie sich (unterschrift.js). -->
      <section class="gruppe">
        <p class="gruppe-titel">Your signature</p>
        <p class="hinweis">Sign with your finger. It is saved and used for your next reports too.</p>
        <canvas id="unterschrift" class="unterschrift-feld"></canvas>
        <button type="button" id="unterschrift-weg" class="knopf">Clear signature</button>
        <p id="chef-hinweis" class="hinweis"></p>
      </section>

      <!-- Export-Knöpfe: Excel und PDF. -->
      <div class="export-knoepfe">
        <button type="button" id="excel" class="knopf">Excel (.xlsx)</button>
        <button type="button" id="pdf" class="knopf">PDF with receipts</button>
      </div>
      <!-- Teilen: erst vorbereiten, dann teilen (siehe abrechnung.js). -->
      <button type="button" id="teilen" class="knopf knopf-teilen">Prepare email (Excel + PDF)</button>
      <p id="export-status" class="hinweis" role="status"></p>

      <!-- Hier zeichnet abrechnung.js die fertige Abrechnung. -->
      <div id="bericht" class="bericht"></div>

      <!-- Verschickte Abrechnungen mit Status. abrechnung.js füllt die Liste. -->
      <section id="verlauf-teil" hidden>
        <h2 class="abstand-oben">Sent Reports</h2>
        <ul id="verlauf" class="liste"></ul>
      </section>
    </main>

    <script src="fehler.js"></script>
    <script src="offline.js"></script>
    <script src="hilfen.js"></script>
    <script src="db.js"></script>
    <script src="format.js"></script>
    <script src="tage.js"></script>
    <script src="pauschale.js"></script>
    <script src="kategorien.js"></script>
    <script src="abrechnung-daten.js"></script>
    <script src="excel.js"></script>
    <script src="pdf.js"></script>
    <script src="unterschrift.js"></script>
    <script src="abrechnung.js"></script>
  </body>
</html>
