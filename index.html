<!DOCTYPE html>
<!-- Diese Zeile sagt dem Browser: Das hier ist eine moderne HTML-Seite. -->

<!-- lang="en" sagt dem iPhone, dass die Seite englisch ist. -->
<html lang="en">

  <!-- Der head enthält Infos ÜBER die Seite. Man sieht davon nichts direkt. -->
  <head>
    <!-- Zeichensatz, damit Umlaute wie ä und ö richtig erscheinen. -->
    <meta charset="utf-8">

    <!-- Wichtig fürs Handy: Die Seite soll so breit sein wie der Bildschirm. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Sagt dem iPhone: Diese Seite kann hell und dunkel. -->
    <meta name="color-scheme" content="light dark">

    <!-- Der Name, der oben im Browser-Tab steht. -->
    <title>Travel Expenses</title>

    <!-- Hier holen wir das Aussehen aus der Datei style.css dazu. -->
    <link rel="stylesheet" href="style.css">

    <!-- App-Daten fürs Installieren: Name, Icon, Farben (siehe manifest.webmanifest). -->
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Das iPhone nimmt für den Homescreen dieses Icon. -->
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!-- Vom Homescreen aus ohne Safari-Leisten öffnen, wie eine echte App. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
  </head>

  <!-- Der body ist alles, was man auf dem Bildschirm sieht. -->
  <body>

    <!-- header: der Kopf der Seite mit der Überschrift. -->
    <header>
      <!-- Kleine Begrüßung über der Überschrift. start.js setzt den Namen ein. -->
      <p id="gruss" class="untertitel"></p>
      <h1>Travel Expenses</h1>
    </header>

    <!-- main: der Hauptteil der Seite. -->
    <main>

      <!-- Zwei Kacheln mit Kennzahlen. start.js füllt sie. -->
      <div class="kacheln">
        <a href="abrechnung.html" class="kachel kachel-hervor">
          <span id="kachel-offen" class="kachel-zahl">0,00 €</span>
          <span class="kachel-text">This month</span>
        </a>
        <a href="verlauf.html" class="kachel">
          <span id="kachel-warten" class="kachel-zahl">0</span>
          <span class="kachel-text">Waiting for approval</span>
        </a>
      </div>

      <!-- Abschnitt mit der Liste der Reisen. -->
      <section>
        <!-- Überschrift links, Knopf für eine neue Reise rechts daneben. -->
        <div class="abschnitt-kopf">
          <h2>My Trips</h2>
          <a href="reise-bearbeiten.html" class="kopf-link kopf-link-knopf">+ New Trip</a>
        </div>

        <!-- ul ist eine Liste. start.js füllt sie mit den gespeicherten Reisen. -->
        <!-- Die id ist ein Name, über den wir die Liste finden. -->
        <ul id="reiseliste" class="liste">
          <!-- Platzhalter, solange es keine Reise gibt. -->
          <li class="leer-hinweis">
            <span data-symbol="koffer"></span>
            <div>No trips yet.<br>Tap “+ New Trip” to start.</div>
          </li>
        </ul>
      </section>

      <!-- Belege ohne Reise. Unsichtbar, bis start.js welche findet. -->
      <section id="ohne-reise" hidden>
        <h2>Receipts Without Trip</h2>
        <p class="hinweis">Open a receipt to choose a trip. Receipts without a trip (e.g. fuel) can also be added directly in the report.</p>
        <ul id="belege-ohne-reise" class="liste"></ul>
      </section>

    </main>

    <!-- Scan Receipt und Create Report sind jetzt in der Tab-Leiste unten (navigation.js). -->

    <!-- JavaScript kommt ans Ende, damit die Seite schon da ist, wenn es losläuft. -->
    <script src="fehler.js"></script>
    <script src="offline.js"></script>
    <script src="navigation.js"></script>
    <script src="db.js"></script>
    <script src="format.js"></script>
    <script src="tage.js"></script>
    <script src="pauschale.js"></script>
    <script src="laender.js"></script>
    <script src="kategorien.js"></script>
    <script src="summen.js"></script>
    <script src="belegzeile.js"></script>
    <script src="start.js"></script>
  </body>
</html>
