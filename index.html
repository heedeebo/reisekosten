<!DOCTYPE html>
<!-- Diese Zeile sagt dem Browser: Das hier ist eine moderne HTML-Seite. -->

<!-- lang="en" sagt dem iPhone, dass die Seite englisch ist. -->
<html lang="en">

  <!-- Der head enthält Infos ÜBER die Seite. Man sieht davon nichts direkt. -->
  <head>
    <!-- Zeichensatz, damit Umlaute wie ä und ö richtig erscheinen. -->
    <meta charset="utf-8">

    <!-- Wichtig fürs Handy: Die Seite soll so breit sein wie der Bildschirm. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Sagt dem iPhone: Diese Seite kann hell und dunkel. -->
    <meta name="color-scheme" content="light dark">

    <!-- Der Name, der oben im Browser-Tab steht. -->
    <title>Travel Expenses</title>

    <!-- Hier holen wir das Aussehen aus der Datei style.css dazu. -->
    <link rel="stylesheet" href="style.css?v=12">

    <!-- App-Daten fürs Installieren: Name, Icon, Farben (siehe manifest.webmanifest). -->
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Das iPhone nimmt für den Homescreen dieses Icon. -->
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!-- Vom Homescreen aus ohne Safari-Leisten öffnen, wie eine echte App. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
  </head>

  <!-- Der body ist alles, was man auf dem Bildschirm sieht. -->
  <body>

    <!-- header: der Kopf der Seite mit der Überschrift. -->
    <header>
      <!-- Link oben rechts zu den Einstellungen. -->
      <a href="einstellungen.html" class="kopf-link">Settings</a>
      <h1>Travel Expenses</h1>
    </header>

    <!-- main: der Hauptteil der Seite. -->
    <main>

      <!-- Abschnitt mit der Liste der Reisen. -->
      <section>
        <!-- Überschrift links, Link für eine neue Reise rechts daneben. -->
        <div class="abschnitt-kopf">
          <h2>My Trips</h2>
          <a href="reise-bearbeiten.html" class="kopf-link">+ New Trip</a>
        </div>

        <!-- ul ist eine Liste. start.js füllt sie mit den gespeicherten Reisen. -->
        <!-- Die id ist ein Name, über den wir die Liste finden. -->
        <ul id="reiseliste" class="liste">
          <!-- li ist ein Eintrag. Dieser Platzhalter bleibt, solange es keine Reise gibt. -->
          <li class="leer">No trips yet.</li>
        </ul>
      </section>

      <!-- Belege ohne Reise. Unsichtbar, bis start.js welche findet. -->
      <section id="ohne-reise" hidden>
        <h2>Receipts Without Trip</h2>
        <p class="hinweis">Open a receipt and choose a trip, or create a trip that covers its date.</p>
        <ul id="belege-ohne-reise" class="liste"></ul>
      </section>

    </main>

    <!-- footer: der untere Bereich mit den zwei großen Knöpfen. -->
    <footer>
      <!-- Ein Link, der wie ein Knopf aussieht. Er führt zur Beleg-Seite. -->
      <a href="beleg.html" class="knopf knopf-haupt">Scan Receipt</a>
      <!-- button ist ein Knopf. Hier passiert noch nichts, das kommt in Teil D. -->

      <button type="button" class="knopf">Create Report</button>
    </footer>

    <!-- JavaScript kommt ans Ende, damit die Seite schon da ist, wenn es losläuft. -->
    <script src="fehler.js?v=12"></script>
    <script src="db.js?v=12"></script>
    <script src="format.js?v=12"></script>
    <script src="tage.js?v=12"></script>
    <script src="pauschale.js?v=12"></script>
    <script src="kategorien.js?v=12"></script>
    <script src="summen.js?v=12"></script>
    <script src="belegzeile.js?v=12"></script>
    <script src="start.js?v=12"></script>
  </body>
</html>
